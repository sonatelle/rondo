name: "Check rondo"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux checks only the core, which is the part that has to stay
  # portable: a frontend for another platform would be built on it, and a
  # dependency that quietly went Darwin-only would show up here first.
  # Everything Apple-specific belongs to the macOS job.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2

      # Run inside the flake dev shell so CI uses the toolchain that local
      # development does.
      - name: Format
        run: nix develop -c cargo fmt --check
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: nix develop -c cargo test --workspace

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2

      # The swiftformat flags must stay identical to the ones editors run
      # on save, or it rejects files that were just formatted; and it is
      # pointed at hand-written Swift only, never the generated bindings.
      - name: Format
        run: |
          nix develop -c cargo fmt --check
          nix develop -c shfmt -i 2 -ci --diff scripts
          nix develop -c swiftformat --lint --indent 2 apple/Rondo apple/smoke
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: nix develop -c cargo test --workspace

      # The Rust tests never link the packaged artifact, so they cannot see
      # a package that builds but cannot be used.
      - name: Package for Xcode and run the Swift smoke test
        run: |
          nix develop -c scripts/build-xcframework.sh
          nix develop -c scripts/swift-smoke-test.sh

      # The project file is generated, so it is built from its spec here
      # exactly as it is locally - a spec that no longer produces a working
      # project would otherwise only be discovered by the next person to
      # open Xcode.
      - name: Build and test the app
        run: |
          nix develop -c xcodegen generate --spec apple/project.yml --project apple
          xcodebuild test -project apple/Rondo.xcodeproj -scheme Rondo -destination 'platform=macOS'

      # Tests run against Debug, which builds only the architecture it is
      # running on and so cannot see a Release-only link failure. That is
      # exactly how a broken Release build survived until someone tried to
      # cut a release; this step is what would have caught it.
      - name: Build the app for release
        run: xcodebuild build -project apple/Rondo.xcodeproj -scheme Rondo -configuration Release
