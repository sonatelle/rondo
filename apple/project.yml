# Xcode project specification, read by XcodeGen.
#
# The .xcodeproj it produces is build output and is not in version control:
# a project file is a few thousand lines of generated UUID references that
# two people cannot edit without conflicting, while this file can be read
# and merged. Settings changed in Xcode's inspector are lost on the next
# generate, so they belong here instead.
#
# Regenerate with `xcodegen generate` from this directory, after
# scripts/build-xcframework.sh has produced RondoCore.

name: Rondo

options:
  bundleIdPrefix: com.sonatelle
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Ad-hoc signing, which needs no developer account and is enough to
    # carry entitlements - the sandbox below only takes effect on a signed
    # bundle. It is not notarized, so Gatekeeper still asks the person
    # opening a downloaded copy, which the README explains.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "6.0"

    # Every bundle here is described by this file, so Xcode synthesizes
    # each Info.plist from build settings rather than from a plist file
    # that would have to be kept in step by hand.
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

    # Apple Silicon only. The core is built for one target by
    # scripts/build-xcframework.sh, and Release would otherwise ask for a
    # universal binary and fail to link against a framework that has no
    # Intel slice. Supporting Intel means adding the Rust target to
    # flake.nix and merging both slices; the README says which this is.
    ARCHS: arm64

    # The Rust core is linked statically, so the linker can drop whatever
    # the app never calls - most of what a general-purpose library carries.
    # This is the payoff for choosing a static library over a dylib.
    DEAD_CODE_STRIPPING: "YES"

    # There are no build script phases: the core is packaged by
    # scripts/build-xcframework.sh before Xcode runs. Sandboxing scripts
    # costs nothing today and keeps that separation from eroding, since a
    # script phase added later would fail rather than quietly reach out of
    # the build.
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

# Without this, XcodeGen's per-target scheme has no test action and
# `xcodebuild test` refuses to run.
schemes:
  Rondo:
    build:
      targets:
        Rondo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RondoTests

targets:
  Rondo:
    type: application
    platform: macOS
    sources:
      - path: Rondo
      # Generated bindings, rebuilt by scripts/build-xcframework.sh. They
      # are compiled into the app rather than shipped as their own module,
      # since there is one app and nothing else needs to import them.
      - path: RondoCore/RondoCore.swift
        group: Generated
    dependencies:
      # A static library, so it is linked and not embedded; there is no
      # dylib to sign or to load at launch.
      - framework: RondoCore/RondoCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonatelle.rondo
        INFOPLIST_KEY_CFBundleDisplayName: Rondo
        # Drawn by scripts/make-app-icon.swift, which writes every size the
        # catalogue names. The PNGs are committed rather than generated at
        # build time; there are no script phases here by design.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        # A subscription tracker keeps its own file and talks to nobody.
        ENABLE_APP_SANDBOX: "YES"
        ENABLE_USER_SELECTED_FILES: readwrite

  RondoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RondoTests
    # The app is the test host, so `@testable import Rondo` reaches its
    # internals without those types having to be made public.
    dependencies:
      - target: Rondo
