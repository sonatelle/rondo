[package]
name = "rondo-core"
version.workspace = true
edition.workspace = true
description = "Domain model, billing-cycle math, storage, and import/export for Rondo."
repository.workspace = true
license.workspace = true

[dependencies]
jiff = { version = "0.2.35", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_decimal = { version = "1.42.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
uuid = { version = "1.24.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
