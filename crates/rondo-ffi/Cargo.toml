[package]
name = "rondo-ffi"
version.workspace = true
edition.workspace = true
description = "UniFFI bindings over rondo-core for platform frontends."
repository.workspace = true
license.workspace = true

[lib]
# staticlib is what the XCFramework embeds; lib keeps the crate usable from
# Rust tests and cdylib covers frontends that load a shared library.
crate-type = ["lib", "staticlib", "cdylib"]

# The generator runs at build time only. Keeping it behind a feature keeps
# the bindgen machinery out of the library shipped inside the app.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
jiff = "0.2.35"
rondo-core = { path = "../rondo-core" }
rust_decimal = "1.42.1"
thiserror = "2.0.20"
uniffi = "0.32.0"
uuid = "1.24.1"

[dev-dependencies]
rusqlite = "0.40.2"
